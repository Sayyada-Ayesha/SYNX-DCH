<!DOCTYPE html>
<html>
<head>
    <title>Edit Article - SYNX Content Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border: none; border-radius: 10px; }
    </style>
</head>
<body class="container mt-5">
    <div class="card shadow-sm p-4 mx-auto" style="max-width: 800px;">
        <h4 class="mb-4 fw-bold">Edit Content Workspace</h4>
        <form action="/edit/{{ post[0] }}" method="POST">
            <div class="mb-3">
                <label class="form-label fw-bold">Article Title</label>
                <input type="text" name="title" class="form-control bg-light" value="{{ post[1] }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Main Content</label>
                <textarea name="content" class="form-control bg-light" rows="12" required>{{ post[2] }}</textarea>
            </div>
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-dark w-100">Update Content & Re-run AI Audit</button>
                <a href="/" class="btn btn-outline-secondary w-100">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
