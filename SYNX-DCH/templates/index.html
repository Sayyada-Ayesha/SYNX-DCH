<!DOCTYPE html>
<html>
<head>
    <title>SYNX Digital Content Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .ai-badge { font-size: 0.85rem; padding: 0.4em 0.6em; margin-right: 5px; }
        .card { border: none; border-radius: 10px; }
        .header-brand { font-weight: 700; letter-spacing: 1px; color: #1a1a1a; }
    </style>
</head>
<body class="container mt-5">
    <div class="text-center mb-5">
        <h2 class="header-brand">SYNX AI-POWERED CONTENT HUB</h2>
        <p class="text-muted">Digital Strategy & SEO Architecture</p>
    </div>
    
    <div class="card shadow-sm mb-5 p-4">
        <h4 class="mb-4">Content Editor Workspace</h4>
        <form action="/add" method="POST">
            <div class="mb-3">
                <label class="form-label fw-bold">Article Title</label>
                <input type="text" name="title" class="form-control bg-light" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Main Content</label>
                <textarea name="content" class="form-control bg-light" rows="5" placeholder="Write your high-impact content here..." required></textarea>
            </div>
            <button type="submit" class="btn btn-dark w-100">Run AI Audit & Publish Post</button>
        </form>
    </div>
    
    <hr class="mb-5">
    
    <h4 class="mb-4">Published & Audited Content</h4>
    {% for post in posts %}
    <div class="card mb-4 shadow-sm p-3 border-start border-dark border-4">
        <div class="card-body">
            
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h5 class="card-title fw-bold mb-0">{{ post[1] }}</h5>
                
                <div class="btn-group">
                    <a href="/edit/{{ post[0] }}" class="btn btn-sm btn-outline-primary">Edit</a>
                    <form action="/delete/{{ post[0] }}" method="POST" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this content?');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </div>
            </div>
            
            <p class="card-text text-secondary mt-3" style="white-space: pre-wrap;">{{ post[2] }}</p>
            
            <div class="mt-4 p-3 bg-light rounded border">
                <h6 class="text-uppercase text-muted" style="font-size: 0.8rem;">AI Audit Results</h6>
                <span class="badge bg-primary ai-badge">SEO Keywords: {{ post[3] }}</span>
                <span class="badge bg-info text-dark ai-badge">Readability: {{ post[4] }}</span>
                <span class="badge bg-success ai-badge">Status: {{ post[5] }}</span>
            </div>
        </div>
    </div>
    {% endfor %}
</body>
</html>
