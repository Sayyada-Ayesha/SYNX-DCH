apiVersion: apps/v1
kind: Deployment
metadata:
  name: synx-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: synx-blog
  template:
    metadata:
      labels:
        app: synx-blog
    spec:
      containers:
      - name: synx-container
        image: synx-dch:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000